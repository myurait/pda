executor_id: claude-company
name: Claude Code 会社契約
version: 1
agent: claude
runtime: acp
account: company
environment: minipc
types:
- break-down
- implement
- review
- summarize
adapter:
  command:
  - npx
  - -y
  - '@agentclientprotocol/claude-agent-acp@preview'
  env: {}
capabilities:
  streaming: true
  cancel: true
cost:
  currency: JPY
  per_run_estimate: null
  per_run_seconds_estimate: 5
  rate_limit:
    requests: 1000
    per: hour
resources:
  filesystem:
  - /work
  network:
  - api.anthropic.com
  - claude.ai
  connectors: []
state:
  interruptible: true
  resume: reinject
permissions:
  default: allow_once
  deny_kinds: []
