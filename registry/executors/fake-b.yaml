executor_id: fake-b
name: 試験用エージェント B
version: 1
agent: fake
runtime: acp
account: none
environment: minipc
types:
- break-down
- implement
- review
- summarize
adapter:
  command:
  - python
  - -m
  - pda_fake_agent
  env: {}
capabilities:
  streaming: true
  cancel: true
cost:
  currency: JPY
  per_run_estimate: 0
  per_run_seconds_estimate: 5
  rate_limit:
    requests: 1000
    per: hour
resources:
  filesystem:
  - /work
  network: []
  connectors: []
state:
  interruptible: true
  resume: reinject
permissions:
  default: allow_once
  deny_kinds: []
