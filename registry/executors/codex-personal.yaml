executor_id: codex-personal
name: Codex 個人契約
version: 1
agent: codex
runtime: acp
account: personal
environment: minipc
types:
- break-down
- implement
- review
- summarize
adapter:
  command:
  - npx
  - -y
  - '@agentclientprotocol/codex-acp'
  env:
    INITIAL_AGENT_MODE: agent-full-access
capabilities:
  streaming: true
  cancel: true
cost:
  currency: JPY
  per_run_estimate: null
  per_run_seconds_estimate: 5
  rate_limit:
    requests: 1000
    per: hour
resources:
  filesystem:
  - /work
  network:
  - api.openai.com
  - chatgpt.com
  connectors: []
state:
  interruptible: true
  resume: reinject
permissions:
  default: allow_once
  deny_kinds: []
