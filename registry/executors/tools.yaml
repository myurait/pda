executor_id: tools
name: 検証ツール
version: 1
agent: tools
runtime: tools
account: none
environment: minipc
types:
- verify.test
- verify.lint
adapter:
  command: []
  env: {}
capabilities:
  streaming: false
  cancel: true
cost:
  currency: JPY
  per_run_estimate: 0
  per_run_seconds_estimate: 5
  rate_limit:
    requests: 1000
    per: hour
resources:
  filesystem:
  - /work
  network: []
  connectors: []
state:
  interruptible: true
  resume: reinject
permissions:
  default: allow_once
  deny_kinds: []
