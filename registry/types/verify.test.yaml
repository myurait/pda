type: verify.test
description: テストを実行する
prompt: prompts/verify.test.md
input_schema:
  type: object
  required:
  - job_id
  - type
  - prompt_ref
  - input
  - cell_id
  - context
  properties:
    job_id: &id001
      type: string
    cell_id: *id001
    type:
      const: verify.test
    prompt_ref:
      type: object
      required:
      - id
      - version
      properties:
        id:
          const: verify.test
        version:
          const: 1
      additionalProperties: false
    context:
      type: object
    input: *id001
  additionalProperties: false
output_schema:
  type: object
  required:
  - kind
  - payload
  - meta
  properties:
    kind:
      const: result
    payload:
      type: object
      required:
      - passed
      - exit_code
      - stdout_tail
      - stderr_tail
      properties:
        passed:
          type: boolean
        exit_code:
          type: integer
        stdout_tail:
          type: string
          maxLength: 4000
        stderr_tail:
          type: string
          maxLength: 4000
      additionalProperties: false
    meta:
      type: object
      required:
      - executor_id
      - declaration_version
      - trace_id
      - stop_reason
      properties:
        executor_id: *id001
        declaration_version:
          type: integer
        trace_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        stop_reason: *id001
      additionalProperties: false
  additionalProperties: false
task_def:
  retryCount: 3
  retryLogic: FIXED
  retryDelaySeconds: 10
  timeoutSeconds: 3600
  responseTimeoutSeconds: 600
  timeoutPolicy: TIME_OUT_WF
driver: tools
command:
- pytest
- -q
