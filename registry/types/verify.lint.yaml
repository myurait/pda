type: verify.lint
description: 静的検査を実行する
prompt: prompts/verify.lint.md
input_schema:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  required:
  - job_id
  - type
  - prompt_ref
  - input
  - cell_id
  - workdir
  properties:
    workdir:
      type: string
    job_id:
      type: string
      minLength: 1
    cell_id:
      type: string
      minLength: 1
    type:
      const: verify.lint
    prompt_ref:
      type: object
      required:
      - id
      - version
      properties:
        id:
          const: verify.lint
        version:
          const: 1
      additionalProperties: false
    input:
      type: string
    context:
      type:
      - object
      - 'null'
  additionalProperties: false
output_schema:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  required:
  - kind
  - payload
  - meta
  properties:
    kind:
      enum:
      - result
    payload:
      type: object
      required:
      - passed
      - exit_code
      - stdout_tail
      - stderr_tail
      properties:
        passed:
          type: boolean
        exit_code:
          type: integer
        stdout_tail:
          type: string
        stderr_tail:
          type: string
      additionalProperties: false
    meta:
      type: object
      required:
      - executor_id
      - declaration_version
      - trace_id
      - stop_reason
      properties:
        executor_id:
          type: string
        declaration_version:
          type: integer
        trace_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        stop_reason:
          type: string
      additionalProperties: false
  additionalProperties: false
task_def:
  retryCount: 3
  retryLogic: FIXED
  retryDelaySeconds: 10
  timeoutSeconds: 3600
  responseTimeoutSeconds: 600
  timeoutPolicy: TIME_OUT_WF
driver: tools
command:
- ruff
- check
- .
