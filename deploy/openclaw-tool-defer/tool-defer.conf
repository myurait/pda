# v03-openclaw.service の追加設定 (~/.config/systemd/user/v03-openclaw.service.d/tool-defer.conf)。
# OpenClaw の常駐だけが、PATH の先頭の入口 (bin/claude) を通って Claude Code を起動する。
[Service]
Environment=PATH=/home/user/pda/deploy/openclaw-tool-defer/bin:/home/user/.local/bin:/usr/local/bin:/usr/bin:/bin
Environment=TOOL_DEFER_PORT=37191
Environment=TOOL_DEFER_WRAPPER_LOG=/home/user/.local/state/openclaw-tool-defer/wrapper.log
