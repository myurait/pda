receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 200ms
exporters:
  otlphttp/openobserve:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: ${env:OPENOBSERVE_AUTH}
      stream-name: pda
  file:
    path: /var/lib/pda/events/events.jsonl
    create_directory: true
    rotation:
      max_megabytes: 100
      max_backups: 100
    format: json
service:
  telemetry:
    logs:
      encoding: json
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve, file]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]
