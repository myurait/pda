name: pda-increment-1
services:
  conductor-server:
    image: conductoross/conductor:3.32.4
    environment:
      CONFIG_PROP: pda.properties
      JAVA_OPTS: -Xms256m -Xmx1024m -Dpolyglot.engine.WarnInterpreterOnly=false
    volumes:
    - ./conductor.properties:/app/config/pda.properties:ro
    ports:
    - 8080:8080
    networks:
    - backend
    - ui
    - exec-fake-a
    - exec-fake-b
    - exec-tools
    - exec-jev
    - exec-codex-personal
    - exec-claude-company
    - ingress
    depends_on:
      conductor-redis:
        condition: service_healthy
      conductor-elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/health
      interval: 5s
      timeout: 5s
      retries: 60
  conductor-redis:
    image: redis:6.2.21-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis-data:/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 20
  conductor-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx1024m
      discovery.type: single-node
      xpack.security.enabled: 'false'
    volumes:
    - es-data:/usr/share/elasticsearch/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9200/_cluster/health
      interval: 5s
      timeout: 5s
      retries: 60
  conductor-ui:
    image: conductoross/conductor:3.32.4
    command: []
    entrypoint:
    - nginx
    - -g
    - daemon off;
    volumes:
    - ./conductor-ui.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - ${CONDUCTOR_UI_PORT:-5000}:5000
    networks:
    - ui
    - ingress
    depends_on:
      conductor-server:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:5000/
      interval: 10s
      timeout: 5s
      retries: 10
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.60.1
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?Set ZO_ROOT_USER_EMAIL in deploy/.env}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Set ZO_ROOT_USER_PASSWORD in
        deploy/.env}
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: 'false'
    ports:
    - 5080:5080
    volumes:
    - observe-data:/data
    networks:
    - observability
    - ingress
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.148.0
    user: 0:0
    environment:
      OPENOBSERVE_AUTH: ${OPENOBSERVE_AUTH:?Set OPENOBSERVE_AUTH in deploy/.env}
    volumes:
    - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    - events:/var/lib/pda/events
    networks:
    - observability
    - exec-fake-a
    - exec-fake-b
    - exec-tools
    - exec-jev
    - exec-codex-personal
    - exec-claude-company
    depends_on:
    - openobserve
  exec-fake-a:
    image: pda-executor:increment-1
    build:
      context: ..
      dockerfile: deploy/executors/Dockerfile
      target: base
    init: true
    environment:
      PDA_EXECUTOR_ID: fake-a
      CONDUCTOR_URL: http://conductor-server:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PDA_REGISTRY_DIR: /registry
    volumes:
    - pda-work:/work
    - ../registry:/registry:ro
    networks:
    - exec-fake-a
    depends_on:
      conductor-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    stop_grace_period: 15s
  exec-fake-b:
    image: pda-executor:increment-1
    build:
      context: ..
      dockerfile: deploy/executors/Dockerfile
      target: base
    init: true
    environment:
      PDA_EXECUTOR_ID: fake-b
      CONDUCTOR_URL: http://conductor-server:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PDA_REGISTRY_DIR: /registry
      FAKE_MODE: ${FAKE_B_MODE:-echo}
      FAKE_SLEEP_SECONDS: ${FAKE_SLEEP_SECONDS:-700}
      conductor.worker.all.lease_extend_enabled: ${FAKE_B_LEASE_EXTEND:-true}
    volumes:
    - pda-work:/work
    - ../registry:/registry:ro
    networks:
    - exec-fake-b
    depends_on:
      conductor-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    stop_grace_period: 15s
  exec-tools:
    image: pda-executor:increment-1
    build:
      context: ..
      dockerfile: deploy/executors/Dockerfile
      target: base
    init: true
    environment:
      PDA_EXECUTOR_ID: tools
      CONDUCTOR_URL: http://conductor-server:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PDA_REGISTRY_DIR: /registry
    volumes:
    - pda-work:/work
    - ../registry:/registry:ro
    networks:
    - exec-tools
    depends_on:
      conductor-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    stop_grace_period: 15s
  exec-jev:
    image: pda-executor:increment-1
    build:
      context: ..
      dockerfile: deploy/executors/Dockerfile
      target: base
    init: true
    environment:
      PDA_EXECUTOR_ID: jev
      CONDUCTOR_URL: http://conductor-server:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PDA_REGISTRY_DIR: /registry
      JEV_MODE: ${JEV_MODE:-fixture}
      PDA_FIXTURE_EXECUTOR: ${PDA_FIXTURE_EXECUTOR:-}
      PDA_FIXTURE_TYPE: ${PDA_FIXTURE_TYPE:-implement}
    volumes:
    - pda-work:/work
    - ../registry:/registry:ro
    - ../secrets:/secrets:ro
    networks:
    - exec-jev
    - egress-jev
    depends_on:
      conductor-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    stop_grace_period: 15s
  exec-codex-personal:
    image: pda-executor:increment-1-real
    build:
      context: ..
      dockerfile: deploy/executors/Dockerfile
      target: real
    init: true
    environment:
      PDA_EXECUTOR_ID: codex-personal
      CONDUCTOR_URL: http://conductor-server:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PDA_REGISTRY_DIR: /registry
    volumes:
    - pda-work:/work
    - ../registry:/registry:ro
    - ${CODEX_AUTH_DIR:-../secrets/codex}:/root/.codex
    networks:
    - exec-codex-personal
    - egress-codex-personal
    depends_on:
      conductor-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    stop_grace_period: 15s
    profiles:
    - real
  exec-claude-company:
    image: pda-executor:increment-1-real
    build:
      context: ..
      dockerfile: deploy/executors/Dockerfile
      target: real
    init: true
    environment:
      PDA_EXECUTOR_ID: claude-company
      CONDUCTOR_URL: http://conductor-server:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PDA_REGISTRY_DIR: /registry
      CLAUDE_CONFIG_DIR: /claude-config
    volumes:
    - pda-work:/work
    - ../registry:/registry:ro
    - ${CLAUDE_AUTH_DIR:-../secrets/claude}:/claude-config
    networks:
    - exec-claude-company
    - egress-claude-company
    depends_on:
      conductor-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    stop_grace_period: 15s
    profiles:
    - real
  conductor-mirror:
    image: pda-executor:increment-1
    build:
      context: ..
      dockerfile: deploy/executors/Dockerfile
      target: base
    command:
    - python
    - -m
    - pda_mirror
    init: true
    environment:
      CONDUCTOR_URL: http://conductor-server:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
    - exec-jev
    depends_on:
      conductor-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
networks:
  backend:
    internal: true
  observability:
    internal: true
  ui:
    internal: true
  exec-fake-a:
    internal: true
  exec-fake-b:
    internal: true
  exec-tools:
    internal: true
  exec-jev:
    internal: true
  exec-codex-personal:
    internal: true
  exec-claude-company:
    internal: true
  egress-jev: {}
  egress-codex-personal: {}
  egress-claude-company: {}
  ingress: {}
volumes:
  redis-data: {}
  es-data: {}
  observe-data: {}
  events: {}
  pda-work: {}
