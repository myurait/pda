[project]
name = "pda-increment-one"
version = "0.1.0"
description = "PDA v0.2 executor wrapper and Conductor event mirror"
requires-python = ">=3.12,<3.13"
dependencies = [
  "conductor-python==2.0.0",
  "agent-client-protocol==0.12.1",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "jsonschema==4.26.0",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pda_wrapper", "src/pda_mirror", "src/pda_fake_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: Docker Compose end-to-end tests (PDA_E2E=1)"]
