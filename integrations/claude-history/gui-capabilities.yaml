version: 3
expires_after: 8h
idle_timeout: 30m
allow:
  tools:
    - start_session
    - end_session
    - check_permissions
    - get_config
    - list_apps
    - list_windows
    - get_window_state
    - get_accessibility_tree
    - click
    - scroll
    - type_text
    - press_key
    - set_value
resources:
  apps:
    - bundle_id: com.anthropic.claudefordesktop
      launch: false
      windows: all
  desktop:
    display: false
