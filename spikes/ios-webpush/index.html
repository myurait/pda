<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><title>ホーム画面の通知テスト</title><style>

</style><script src="/pda-push-test/app.js" defer></script></head><body><h1>ホーム画面の通知テスト・再設定</h1><p>通常の完了通知と同じ購読を確認・再設定します。②は診断用の固定テスト通知です。</p><div id="status" role="status">端末を確認しています…</div><section id="controls"><button id="subscribe" disabled>① このアプリの通知を許可</button><button id="send" disabled>② 20秒後にテスト通知を送る</button><p>②の後、iPhoneをロックしてください。「PDA ホーム画面テスト」という通知が届いたらタップします。Open WebUIのトップへ戻れば、Safariのタブが増えていないか確認してください。</p><button id="stop" class="secondary" disabled>通知購読を解除（通常通知も停止）</button><button id="refresh" class="secondary">状態を再確認</button></section><p><a id="return" href="/" target="_self">Open WebUIのトップへ戻る</a></p><small>AppleのPushサービスへ暗号化して送ります。診断は固定文のみ、通常通知は保存済みチャットタイトルと回答冒頭です。購読情報はこのPDA内だけに保存します。</small></body></html>
